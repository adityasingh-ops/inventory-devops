# Lab 1: image tag does not exist -> ImagePullBackOff
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image
  namespace: inventory
spec:
  replicas: 1
  selector:
    matchLabels: { app: broken-image }
  template:
    metadata:
      labels: { app: broken-image }
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/inventory-backend:does-not-exist
