{{- $p := .Values.postgres }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres
type: Opaque
stringData:
  username: {{ $p.username | quote }}
  password: {{ $p.password | quote }}
  url: "postgres://{{ $p.username }}:{{ $p.password }}@postgres:5432/{{ $p.database }}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  {{- if $p.storageClass }}
  storageClassName: {{ $p.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRES_DB, value: {{ $p.database | quote }} }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: postgres, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
