name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1) TEST: unit tests + frontend build. If this fails, nothing gets built or pushed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend tests
        working-directory: backend
        run: |
          npm ci
          npm test
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # 2) BUILD + SCAN + PUSH: Docker images tagged with the commit SHA
  build-scan-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image names (GHCR needs lowercase)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/$OWNER/inventory-backend:${{ github.sha }}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/$OWNER/inventory-frontend:${{ github.sha }}" >> $GITHUB_ENV
      - name: Build images
        run: |
          docker build -t $BACKEND_IMAGE ./backend
          docker build -t $FRONTEND_IMAGE ./frontend
      - name: Trivy scan (fails on fixable HIGH/CRITICAL CVEs)
        run: |
          for IMG in $BACKEND_IMAGE $FRONTEND_IMAGE; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 $IMG
          done
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push images
        run: |
          docker push $BACKEND_IMAGE
          docker push $FRONTEND_IMAGE

  # 3) DEPLOY: install the Helm chart on a throwaway Kubernetes (kind) cluster
  #    inside the CI runner and smoke-test it. Free - no cloud account needed.
  deploy:
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Set image names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND=ghcr.io/$OWNER/inventory-backend" >> $GITHUB_ENV
          echo "FRONTEND=ghcr.io/$OWNER/inventory-frontend" >> $GITHUB_ENV
      - name: Pull the images CI just pushed
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull $BACKEND:${{ github.sha }}
          docker pull $FRONTEND:${{ github.sha }}
      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@v1
      - uses: azure/setup-helm@v4
      - name: Deploy with Helm
        run: |
          kind load docker-image $BACKEND:${{ github.sha }} $FRONTEND:${{ github.sha }} --name chart-testing
          kubectl apply -f k8s/namespace.yaml
          helm upgrade --install inventory ./helm/inventory -n inventory \
            --set backend.image=$BACKEND --set backend.tag=${{ github.sha }} \
            --set frontend.image=$FRONTEND --set frontend.tag=${{ github.sha }} \
            --set ingress.enabled=false \
            --wait --timeout 5m
          kubectl get pods,svc,hpa -n inventory
          helm list -n inventory
      - name: Smoke test
        run: |
          kubectl port-forward -n inventory svc/frontend 8080:8080 &
          sleep 5
          curl -sf -X POST localhost:8080/api/items -H 'Content-Type: application/json' -d '{"name":"ci-test","quantity":1}'
          curl -sf localhost:8080/api/items | grep ci-test
